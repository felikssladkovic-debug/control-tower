spring.application.name=PACT
pact.version=@project.version@
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.datasource.url=${PACT_DB_JDBC_URL}
spring.datasource.username=pact_app
spring.datasource.password=${PACT_DB_APP_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${PACT_DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.connection-timeout=${PACT_DB_CONNECTION_TIMEOUT_MS:3000}
spring.datasource.hikari.connection-test-query=SELECT 1
spring.flyway.url=${PACT_DB_JDBC_URL}
spring.flyway.user=pact_migrator
spring.flyway.password=${PACT_DB_MIGRATOR_PASSWORD}
spring.flyway.schemas=pact
spring.flyway.default-schema=pact
spring.flyway.connect-retries=0
management.endpoint.health.group.readiness.include=readinessState,db
