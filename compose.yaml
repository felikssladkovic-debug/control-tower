services:
  postgres:
    image: postgres:17.11-trixie
    environment:
      POSTGRES_DB: pact
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PACT_DB_ADMIN_PASSWORD:?Set PACT_DB_ADMIN_PASSWORD in .env}
      PACT_DB_MIGRATOR_PASSWORD: ${PACT_DB_MIGRATOR_PASSWORD:?Set PACT_DB_MIGRATOR_PASSWORD in .env}
      PACT_DB_APP_PASSWORD: ${PACT_DB_APP_PASSWORD:?Set PACT_DB_APP_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pact"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: ./apps/backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      PACT_DB_JDBC_URL: jdbc:postgresql://postgres:5432/pact
      PACT_DB_APP_PASSWORD: ${PACT_DB_APP_PASSWORD:?Set PACT_DB_APP_PASSWORD in .env}
      PACT_DB_MIGRATOR_PASSWORD: ${PACT_DB_MIGRATOR_PASSWORD:?Set PACT_DB_MIGRATOR_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  postgres_data:
